[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Enterprise Search (RAG) with Hybrid Retrieval and Re-ranking"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "datasets<3.0.0",
    "faiss-cpu>=1.9.0",
    "faker>=40.43.0",
    "fastapi>=0.100.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "numpy>=2,<3",
    "openai>=3.36.0",
    "pandas>=2.3.3",
    "pdfplumber>=0.11.10",
    "pinecone>=3.0.0",
    "prometheus-client>=0.26.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.25.0",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "torchvision>=0.25.0",
    "transformers>=5.20.2",
    "uvicorn>=0.23.0",
    "watchdog>=6.0.0",
]

[tool.setuptools]
packages = ["src"]
